name: Publish beta client

on:
  push:
    branches: ['beta', 'test/room-voice']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[republish-beta0.1.7]') }}

jobs:
  sync_source:
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/test/room-voice'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror beta source to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_LFS_SKIP_PUSH: '1'
        run: |
          if (-not $env:GITEE_TOKEN) { throw 'Configure the GITEE_TOKEN repository secret' }
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("hxxztch:$env:GITEE_TOKEN"))
          Write-Output "::add-mask::$basic"
          git remote add gitee https://gitee.com/hxxztch/watching-together.git
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git -c "http.extraHeader=Authorization: Basic $basic" -c credential.helper= push gitee "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not mirror beta source' }
  plan:
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/test/room-voice'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan release from source version
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH_VERSION: ${{ contains(github.event.head_commit.message, '[republish-test0.1.9]') && 'test0.1.9' || contains(github.event.head_commit.message, '[republish-beta0.1.7]') && 'beta0.1.7' || '' }}
          RETRY_MIRROR_VERSION: ${{ contains(github.event.head_commit.message, '[add-test019-to-test0110-delta]') && 'test0.1.10' || (contains(github.event.head_commit.message, '[retry-mirror-test0.1.9]') || contains(github.event.head_commit.message, '[retire-017-to-019-delta]')) && 'test0.1.9' || '' }}
        run: python packaging/prepare_release.py
  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      REPUBLISH_VERSION: ${{ contains(github.event.head_commit.message, '[republish-test0.1.9]') && 'test0.1.9' || contains(github.event.head_commit.message, '[republish-beta0.1.7]') && 'beta0.1.7' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: '3.8.20'
          activate-environment: build
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install pinned packages
        shell: pwsh
        run: |
          python -m pip install pip==25.0.1
          python -m pip install -r packaging/requirements-lock.txt
          python -m pip check
      - name: Run unit tests
        if: needs.plan.outputs.build == 'true'
        run: python -m unittest discover -s tests -v
      - name: Verify update source switching and downloads
        if: needs.plan.outputs.build == 'true'
        run: python tests/update_sources_smoke.py
      - name: Verify and build portable client
        if: needs.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          ./packaging/fetch_cloudflared.ps1
          ./packaging/fetch_opus.ps1
          python tests/voice_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Room voice check failed' }
          New-Item -ItemType Directory -Force -Path "build/$env:RELEASE_VERSION" | Out-Null
          python packaging/build_integrated.py build 2>&1 | Tee-Object -FilePath "build/$env:RELEASE_VERSION/build-console.log"
          if ($LASTEXITCODE -ne 0) { throw 'Portable client build failed' }
          python packaging/verify_integrated.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable client verification failed' }
          python packaging/build_integrated.py archive --output dist/beta-archives
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive failed' }
      - name: Build deltas from previous beta releases
        if: needs.plan.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = [version]($env:RELEASE_VERSION -replace '^(beta|test)', '')
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            $old = [string]$release.tag_name
            # The locally shared beta0.1.7 is incompatible with the GitHub baseline.
            if ($old -eq 'beta0.1.7') { continue }
            if ($old -notmatch '^(beta|test)\d+\.\d+\.\d+$' -or $old -eq $env:RELEASE_VERSION) { continue }
            if ([version]($old -replace '^(beta|test)', '') -gt $current) { continue }
            if (-not ($release.assets | Where-Object { $_.name -eq "$old.zip" })) { continue }
            $oldZip = Join-Path $env:RUNNER_TEMP "$old.zip"
            gh release download $old --repo $env:GITHUB_REPOSITORY --pattern "$old.zip" --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw "Could not download $old" }
            $deltaZip = "dist/beta-archives/${old}-to-$env:RELEASE_VERSION.delta.zip"
            python packaging/make_delta.py --from-zip $oldZip --to-zip "dist/beta-archives/$env:RELEASE_VERSION.zip" --from-version $old --to-version $env:RELEASE_VERSION --output $deltaZip
            if ($LASTEXITCODE -ne 0) { throw "Could not build delta from $old" }
            Remove-Item -LiteralPath $oldZip
          }
      - name: Report build diagnostics
        if: failure()
        shell: pwsh
        run: python packaging/ci_diagnostics.py
      - name: Prepare release notes
        if: needs.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          $lines = Get-Content '更新日志.txt' -Encoding UTF8
          if ($lines[0] -notmatch "^$([regex]::Escape($env:RELEASE_VERSION))（") { throw 'The changelog must start with the release tag' }
          $next = 1
          while ($next -lt $lines.Count -and $lines[$next] -notmatch '^(beta|test)\d+\.\d+\.\d+（') { $next++ }
          $body = ($lines[1..($next - 1)] -join "`n").Trim()
          if (-not $body) { throw 'Release notes are empty' }
          Set-Content -LiteralPath release-notes.txt -Value $body -Encoding UTF8
      - name: Move explicitly republished version tag
        if: env.REPUBLISH_VERSION == env.RELEASE_VERSION
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        id: move_release_tag
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$env:RELEASE_VERSION"
          $lookupExit = $LASTEXITCODE
          if ($lookupExit -eq 2) { exit 0 }
          if ($lookupExit -ne 0) { throw 'Could not check the published tag' }
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_VERSION" -f "sha=$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'Could not move the published tag' }
          "moved=true" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: needs.plan.outputs.build == 'true'
        with:
          files: dist/beta-archives/*
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(env.RELEASE_VERSION, 'test') }}
          make_latest: ${{ startsWith(env.RELEASE_VERSION, 'test') && 'false' || 'true' }}
          body_path: release-notes.txt
      - name: Back up the incompatible beta0.1.7 delta
        if: env.RELEASE_VERSION == 'test0.1.9' && contains(github.event.head_commit.message, '[retire-017-to-019-delta]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test0.1.9 --repo $env:GITHUB_REPOSITORY --pattern 'beta0.1.7-to-test0.1.9.delta.*' --dir retired-delta
          if ($LASTEXITCODE -ne 0) { throw 'Could not back up the delta before withdrawing it' }
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_VERSION == 'test0.1.9' && contains(github.event.head_commit.message, '[retire-017-to-019-delta]')
        with:
          name: retired-beta0.1.7-to-test0.1.9-delta
          path: retired-delta/
          if-no-files-found: error
      - name: Withdraw the incompatible beta0.1.7 delta
        if: env.RELEASE_VERSION == 'test0.1.9' && contains(github.event.head_commit.message, '[retire-017-to-019-delta]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($asset in @('beta0.1.7-to-test0.1.9.delta.zip', 'beta0.1.7-to-test0.1.9.delta.json')) {
            gh release delete-asset test0.1.9 $asset --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not withdraw $asset" }
          }
      - name: Add a delta between published test0.1.9 and test0.1.10
        if: env.RELEASE_VERSION == 'test0.1.10' && contains(github.event.head_commit.message, '[add-test019-to-test0110-delta]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = 'test0.1.9'
          $target = 'test0.1.10'
          $dir = Join-Path $env:RUNNER_TEMP 'published-voice-packages'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($tag in @($source, $target)) {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not read release $tag" }
            $asset = $release.assets | Where-Object { $_.name -eq "$tag.zip" }
            if (-not $asset -or $asset.digest -notmatch '^sha256:[a-fA-F0-9]{64}$') {
              throw "Missing verified full package for $tag"
            }
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "$tag.zip" --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "Could not download $tag" }
            $hash = (Get-FileHash -LiteralPath (Join-Path $dir "$tag.zip") -Algorithm SHA256).Hash
            if ("sha256:$hash" -ne $asset.digest) { throw "Published package hash mismatch for $tag" }
          }
          $delta = Join-Path $dir "$source-to-$target.delta.zip"
          python packaging/make_delta.py --from-zip (Join-Path $dir "$source.zip") --to-zip (Join-Path $dir "$target.zip") --from-version $source --to-version $target --output $delta
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate delta' }
          gh release upload $target --repo $env:GITHUB_REPOSITORY $delta ([IO.Path]::ChangeExtension($delta, '.json')) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the delta and its manifest' }
      - name: Publish static beta update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish_update_feed.py
      - name: Invalidate outgoing deltas built from the previous same-version files
        if: steps.move_release_tag.outputs.moved == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/invalidate_republished_deltas.py
