name: Publish beta client

on:
  push:
    branches: ['beta', 'codex/p2p-lan-prototype']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  sync_source:
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/codex/p2p-lan-prototype'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror beta source to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_LFS_SKIP_PUSH: '1'
        run: |
          if (-not $env:GITEE_TOKEN) { throw 'Configure the GITEE_TOKEN repository secret' }
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("hxxztch:$env:GITEE_TOKEN"))
          Write-Output "::add-mask::$basic"
          git remote add gitee https://gitee.com/hxxztch/watching-together.git
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git -c "http.extraHeader=Authorization: Basic $basic" -c credential.helper= push gitee "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not mirror beta source' }
  plan:
    needs: sync_source
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/codex/p2p-lan-prototype'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan release from source version
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/prepare_release.py
  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ startsWith(needs.plan.outputs.version, 'test') && '3.11.9' || '3.8.20' }}
          activate-environment: build
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install pinned packages
        shell: pwsh
        run: |
          python -m pip install pip==25.0.1
          python -m pip install -r packaging/requirements-lock.txt
          if ($env:RELEASE_VERSION.StartsWith('test')) { python -m pip install -r requirements-p2p.txt }
          python -m pip check
      - name: Run unit tests
        if: needs.plan.outputs.build == 'true'
        run: python -m unittest discover -s tests -v
      - name: Verify update source switching and downloads
        if: needs.plan.outputs.build == 'true'
        run: python tests/update_sources_smoke.py
      - name: Verify and build portable client
        if: needs.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          ./packaging/fetch_cloudflared.ps1
          New-Item -ItemType Directory -Force -Path "build/$env:RELEASE_VERSION" | Out-Null
          python packaging/build_integrated.py build 2>&1 | Tee-Object -FilePath "build/$env:RELEASE_VERSION/build-console.log"
          if ($LASTEXITCODE -ne 0) { throw 'Portable client build failed' }
          python packaging/verify_integrated.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable client verification failed' }
          python packaging/build_integrated.py archive --output dist/beta-archives
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive failed' }
      - name: Build deltas from previous beta releases
        if: needs.plan.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = [version]($env:RELEASE_VERSION -replace '^(beta|test)', '')
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            $old = [string]$release.tag_name
            if ($old -notmatch '^(beta|test)\d+\.\d+\.\d+$' -or $old -eq $env:RELEASE_VERSION) { continue }
            if ([version]($old -replace '^(beta|test)', '') -gt $current) { continue }
            if (-not ($release.assets | Where-Object { $_.name -eq "$old.zip" })) { continue }
            $oldZip = Join-Path $env:RUNNER_TEMP "$old.zip"
            gh release download $old --repo $env:GITHUB_REPOSITORY --pattern "$old.zip" --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw "Could not download $old" }
            $deltaZip = "dist/beta-archives/${old}-to-$env:RELEASE_VERSION.delta.zip"
            python packaging/make_delta.py --from-zip $oldZip --to-zip "dist/beta-archives/$env:RELEASE_VERSION.zip" --from-version $old --to-version $env:RELEASE_VERSION --output $deltaZip
            if ($LASTEXITCODE -ne 0) { throw "Could not build delta from $old" }
            Remove-Item -LiteralPath $oldZip
          }
      - name: Report build diagnostics
        if: failure()
        shell: pwsh
        run: python packaging/ci_diagnostics.py
      - name: Prepare release notes
        if: needs.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          $lines = Get-Content '更新日志.txt' -Encoding UTF8
          if ($lines[0] -notmatch "^$([regex]::Escape($env:RELEASE_VERSION))（") { throw 'The changelog must start with the release tag' }
          $next = 1
          while ($next -lt $lines.Count -and $lines[$next] -notmatch '^(beta|test)\d+\.\d+\.\d+（') { $next++ }
          $body = ($lines[1..($next - 1)] -join "`n").Trim()
          if (-not $body) { throw 'Release notes are empty' }
          Set-Content -LiteralPath release-notes.txt -Value $body -Encoding UTF8
      - uses: softprops/action-gh-release@v2
        if: needs.plan.outputs.build == 'true'
        with:
          files: dist/beta-archives/*
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(env.RELEASE_VERSION, 'test') }}
          make_latest: ${{ startsWith(env.RELEASE_VERSION, 'test') && 'false' || 'true' }}
          body_path: release-notes.txt
      - name: Publish static beta update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish_update_feed.py
      - name: Mirror version tag, release assets and update feed to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_LFS_SKIP_PUSH: '1'
        run: |
          if (-not $env:GITEE_TOKEN) { throw 'Configure the GITEE_TOKEN repository secret' }
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("hxxztch:$env:GITEE_TOKEN"))
          Write-Output "::add-mask::$basic"
          git remote add gitee https://gitee.com/hxxztch/watching-together.git
          git fetch origin "refs/tags/$env:RELEASE_VERSION`:refs/tags/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch published version tag' }
          # Manual retries use the existing immutable version tag, not the newer HEAD.
          git -c "http.extraHeader=Authorization: Basic $basic" -c credential.helper= push gitee "refs/tags/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not mirror version tag' }
          python packaging/publish_gitee.py --tag $env:RELEASE_VERSION --assets-dir "dist/gitee-$env:RELEASE_VERSION" --from-github
          if ($LASTEXITCODE -ne 0) { throw 'Gitee release publication failed' }
